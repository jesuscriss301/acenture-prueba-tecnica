spring.application.name=franchise-api

# DynamoDB (los valores se pueden sobreescribir con variables de entorno)
app.dynamodb.table-name=${DYNAMODB_TABLE:franchises}
app.dynamodb.region=${AWS_REGION:us-east-2}
# Vacío = AWS real. Para DynamoDB Local: http://localhost:8000
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}

# Documentacion OpenAPI: contrato escrito a mano (contract-first) en static/openapi.yaml
# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
# springdoc no detecta rutas funcionales; su documento generado no se usa.
# Se mantiene habilitado porque Swagger UI obtiene de ahi su configuracion.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
