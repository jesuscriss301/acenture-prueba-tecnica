# Entorno local completo: DynamoDB Local + creación de la tabla + API.
# Uso:  docker compose up --build
# API:  http://localhost:8080   ·   Swagger: http://localhost:8080/swagger-ui.html
services:

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  # Crea la tabla "franchises" (PK/SK) en DynamoDB Local y termina
  init-table:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 > /dev/null 2>&1; do
          echo "Esperando a DynamoDB Local..."; sleep 1;
        done
        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name franchises \
          --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
          --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST > /dev/null 2>&1 || true
        echo "Tabla franchises lista"

  api:
    build: .
    depends_on:
      init-table:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: us-east-2
      DYNAMODB_TABLE: franchises
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      # DynamoDB Local acepta cualquier credencial
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
